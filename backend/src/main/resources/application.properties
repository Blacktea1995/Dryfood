# ===== Cau hinh ung dung =====
spring.application.name=dryfood-backend
server.port=${PORT:8080}

# ===== MySQL database (local: DBeaver; cloud: dat bien moi truong) =====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/dryfood?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh&createDatabaseIfNotExist=true&sslMode=DISABLED}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:dryfood}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Dryfood@2026}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===== Logging =====
logging.level.org.hibernate.SQL=WARN
logging.level.com.evomap.dryfood=INFO

# ===== Gioi han upload =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ===== Cau hinh ung dung =====
spring.application.name=dryfood-backend
server.port=${PORT:8080}

# ===== MySQL database (quan ly bang DBeaver) =====
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/dryfood?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh&createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=dryfood
spring.datasource.password=Dryfood@2026

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===== Logging =====
logging.level.org.hibernate.SQL=WARN
logging.level.com.evomap.dryfood=INFO

# ===== Gioi han upload =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
